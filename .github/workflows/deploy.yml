# Uploads the site to soheililabs.com over FTPS whenever main changes.
#
# Setup (repository Settings -> Secrets and variables -> Actions):
#   Secrets:   FTP_SERVER    cPanel's server hostname (shown in cPanel under
#                            "Server Information"), not ftp.soheililabs.com,
#                            so the TLS certificate matches.
#              FTP_USERNAME  an FTP account limited to the site's folder
#              FTP_PASSWORD
#   Variable:  FTP_SERVER_DIR  optional; folder to upload into, relative to
#                            the FTP account's home. Defaults to ./ for an
#                            account whose home is the site root. Use
#                            public_html/ for the main cPanel account.
#
# Pull requests into main run a dry run: they connect with the same
# credentials and list what merging would upload, without uploading it.
#
# Only files that changed since the last deploy are uploaded; the list of
# what was deployed is kept on the server in .ftp-deploy-sync-state.json.
# Files on the server that this workflow never uploaded are left alone.
name: Deploy to soheililabs.com

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would change; upload nothing"
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy credentials are configured
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -n "$FTP_SERVER" ] || missing="$missing FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || missing="$missing FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See the setup notes at the top of .github/workflows/deploy.yml."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Upload changed files
        uses: SamKirkland/FTP-Deploy-Action@3a9c65ae0fc12ac924ccef8afc26941cc43aad0b # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          dry-run: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            services/**
            UPLOAD-NOTE.txt
            README*
