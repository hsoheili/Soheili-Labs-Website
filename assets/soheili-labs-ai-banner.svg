<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="t">
  <title id="t">Soheili Labs AI website studio</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a3a"/><stop offset="1" stop-color="#0d4aa8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.25" r="0.55">
