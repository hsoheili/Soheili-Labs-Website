    <circle cx="30" cy="26" r="7" fill="#ff6b6b"/><circle cx="54" cy="26" r="7" fill="#ffc542"/><circle cx="78" cy="26" r="7" fill="#35c46a"/>
    <rect x="120" y="16" width="360" height="20" rx="10" fill="#fff"/>
