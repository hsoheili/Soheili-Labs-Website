# /etc/nginx/sites-available/downloads.soheililabs.com
# certbot --nginx adds the HTTPS server block and certificate lines.
server {
    listen 80;
    listen [::]:80;
    server_name downloads.soheililabs.com;

    client_max_body_size 1m;

    location = /stripe/webhook { proxy_pass http://127.0.0.1:3202; include /etc/nginx/proxy_params; }
    location = /download       { proxy_pass http://127.0.0.1:3202; include /etc/nginx/proxy_params; proxy_buffering off; }
    location = /health         { proxy_pass http://127.0.0.1:3202; include /etc/nginx/proxy_params; }
    location / { return 404; }
}
